[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x2-voice-agent"
version = "0.1.0"
description = "Streaming Doubao voice agent for the X2 Unity simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=14.0",
    "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["x2_agent"]
