name: Validate example and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install example
        working-directory: example
        run: python -m pip install -e .
      - name: Check documentation
        run: python -B scripts/check_docs.py
      - name: Run local regression tests
        working-directory: example
        run: python -B -m unittest discover -s tests -v
      - name: Check module entry points
        working-directory: example
        run: |
          python -B -m x2_agent --help
          python -B -m x2_agent.demo --help
